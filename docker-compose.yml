networks:
  web:
    driver: bridge

volumes:
  web_db:

services:
  apache:
    container_name: ${NAME}_apache
    build: ./docker/build/apache
    ports:
      - '8000:80'
      - '8443:443'
    depends_on:
      - mysql
      - mailpit
    volumes:
      - './docker/etc/apache/virtualhost.conf:/etc/apache2/sites-enabled/000-default.conf:ro'
      - './docker/etc/apache/default-ssl.conf:/etc/apache2/sites-enabled/default-ssl.conf'
      - './docker/etc/php/php.ini:/usr/local/etc/php/php.ini'
      - './docker/etc/apache/ssl/:/etc/apache2/conf/ssl'
      - './app/${APPLICATION}:/var/www/${APPLICATION}'
    networks:
      - web
  mysql:
    container_name: ${NAME}_mysql
    image: mysql:5.7
    ports:
      - "3306:3306"
    volumes:
      - './docker/etc/mysql/my.cnf:/etc/mysql/conf.d/my.cnf'
      - 'web_db:/var/lib/mysql:cached'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - web

  phpmyadmin:
    container_name: ${NAME}_phpmyadmin
    ports:
      - '8001:80'
    image: nazarpc/phpmyadmin
    networks:
      - web
    depends_on:
      - mysql

  mailpit:
    image: axllent/mailpit
    container_name: ${NAME}_mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - web
